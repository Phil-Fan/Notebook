<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>无重复字符的最长子串</title>
<style>
  :root{
    --panel:rgba(20,27,49,.72); --line:rgba(122,142,192,.20); --text:#e9edf8; --dim:#8b97b8;
    --amber:#ffb03a; --green:#4ade80; --blue:#6ea8ff; --purple:#b58cff; --pink:#ff8fb1; --teal:#5eead4;
    --mono:ui-monospace,SFMono-Regular,Menlo,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;padding:24px;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:radial-gradient(900px 520px at 18% -8%,rgba(58,88,164,.34),transparent 62%),
      radial-gradient(760px 460px at 88% 4%,rgba(120,80,200,.20),transparent 60%),
      linear-gradient(180deg,#080c18,#05070f 60%,#04060c);
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto}
  header{margin-bottom:14px}
  h1{margin:0 0 6px;font-size:21px;font-weight:650}
  header p{margin:0;color:var(--dim);font-size:13px;line-height:1.62;max-width:1010px}
  header p+p{margin-top:4px}
  header p b{color:#cdd6ee;font-weight:600}
  header code{font-family:var(--mono);font-size:12px;color:#a9c6ff;background:rgba(74,168,255,.10);padding:1px 6px;border-radius:6px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:18px;align-items:start}
  @media (max-width:920px){.layout{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px);box-shadow:0 14px 40px rgba(0,0,0,.35)}
  .stage{background:linear-gradient(180deg,rgba(24,32,56,.85),rgba(14,19,36,.85));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.38)}
  .sec-label{text-align:center;font-size:10.5px;letter-spacing:.5px;color:#5f6a8c;font-family:var(--mono);margin:0 0 8px}
  .row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 12px;padding-top:16px}
  .cell{position:relative;min-width:42px;height:48px;padding:0 6px;border-radius:10px;border:1px solid rgba(122,142,192,.22);
    background:rgba(30,39,63,.55);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:16px;color:#c9d3ec}
  .cell .idx{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:9.5px;color:#5f6a8c;font-family:var(--mono)}
  .cell.i{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,176,58,.28);color:#fff3dc}
  .cell.l{background:rgba(110,168,255,.16);border-color:rgba(110,168,255,.7);color:#eaf1ff}
  .cell.r{background:rgba(181,140,255,.16);border-color:rgba(181,140,255,.7);color:#f3e9ff}
  .cell.win{background:rgba(110,168,255,.16);border-color:rgba(110,168,255,.55)}
  .cell.best{background:rgba(74,222,128,.16);border-color:rgba(74,222,128,.62);color:#d9ffe6}
  .cell.bad{background:rgba(255,143,177,.12);border-color:rgba(255,143,177,.6);color:#ffd7e2}
  .cell.dim{opacity:.35}
  .grid{display:grid;gap:6px;justify-content:center;margin:10px 0}
  .g{width:52px;height:52px;border-radius:10px;border:1px solid rgba(122,142,192,.25);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:16px;background:rgba(30,39,63,.55);color:#d5def2}
  .g.on{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,176,58,.28);color:#fff3dc}
  .g.pair{border-color:var(--purple);background:rgba(181,140,255,.16)}
  .g.land{background:rgba(74,222,128,.16);border-color:rgba(74,222,128,.55);color:#d9ffe6}
  .g.sea{opacity:.45}
  .g.hot{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,176,58,.3)}
  .g.ans{background:rgba(110,168,255,.2);border-color:rgba(110,168,255,.7)}
  table.dp{border-collapse:separate;border-spacing:4px;margin:8px auto}
  table.dp td,table.dp th{width:42px;height:36px;text-align:center;font-family:var(--mono);font-size:13px;border-radius:8px}
  table.dp th{color:#8b97b8;font-weight:500}
  table.dp td{background:rgba(30,39,63,.55);border:1px solid rgba(122,142,192,.22);color:#d5def2}
  table.dp td.cur{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,176,58,.25);color:#fff3dc}
  table.dp td.src{border-color:rgba(110,168,255,.7);background:rgba(110,168,255,.14)}
  .tree{display:flex;flex-direction:column;align-items:center;gap:16px;margin:12px 0}
  .trow{display:flex;gap:28px}
  .node{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    border:1px solid rgba(122,142,192,.35);background:rgba(30,39,63,.7)}
  .node.lvl{border-color:rgba(110,168,255,.7);background:rgba(110,168,255,.16)}
  .node.view{border-color:var(--green);background:rgba(74,222,128,.18);color:#d9ffe6}
  .legend{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;font-size:11px;color:#8b97b8;margin:4px 0 8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid transparent}
  .side{display:flex;flex-direction:column;gap:12px}
  .panel{padding:12px 14px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.4px;color:#8b97b8;text-transform:uppercase;margin-bottom:8px}
  .panel-head .tag{font-family:var(--mono);font-size:10px;color:#9fc0ff;text-transform:none;background:rgba(74,168,255,.10);border:1px solid rgba(74,168,255,.25);padding:1px 7px;border-radius:6px}
  .desc{font-size:13px;line-height:1.72;color:#d5deef;min-height:88px}
  .desc b{color:#fff}
  .formula{margin-top:10px;padding-top:9px;border-top:1px dashed rgba(122,142,192,.22);font-family:var(--mono);font-size:11.5px;line-height:1.7;color:#93a4cc}
  .formula b{color:#dfe8ff}
  pre{margin:0;padding:8px 0 10px;font-family:var(--mono);font-size:11.5px;line-height:1.62;color:#9fb0d2;overflow:auto;max-height:360px}
  .ln{display:block;padding:0 14px;white-space:pre;border-left:2px solid transparent}
  .ln.hl{background:rgba(255,176,58,.10);border-left-color:var(--amber);color:#ffe6bf}
  .notes p{margin:0 0 8px;font-size:11.5px;line-height:1.7;color:#8b97b8}
  .notes p:last-child{margin:0}
  .notes code{font-family:var(--mono);font-size:11px;color:#a9c6ff;background:rgba(74,168,255,.10);padding:1px 5px;border-radius:5px}
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}
  button{font-family:inherit;font-size:12.5px;color:#dfe8ff;background:rgba(30,39,63,.85);border:1px solid rgba(122,142,192,.30);border-radius:9px;padding:8px 13px;cursor:pointer}
  button.primary{background:rgba(74,168,255,.18);border-color:rgba(74,168,255,.45)}
  .speed{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:#8b97b8}
  select{font-family:inherit;font-size:11.5px;color:#dfe8ff;background:rgba(30,39,63,.85);border:1px solid rgba(122,142,192,.30);border-radius:8px;padding:5px 7px}
  .hint{width:100%;font-size:11px;color:#5f6a8c}
  kbd{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:5px;border:1px solid rgba(122,142,192,.35);background:rgba(30,39,63,.8);color:#b8c6e6}
  .ans{text-align:center;font-family:var(--mono);font-size:13px;color:#b9f7cf;min-height:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>无重复字符的最长子串</h1>
    <p><code>s = "abcabcbb"</code>。蓝色是当前窗口，琥珀色是刚进来的右端。</p>
    <p>重复字符还在窗口里时，左边界直接跳到它上次出现位置的右边，然后再记长度。</p>
  </header>
  <div class="layout">
    <div class="stage">
      <div class="sec-label">字符串 s</div>
      <div class="row" id="board"></div>
      <div class="ans" id="ans"></div>
    </div>
    <div class="side">
      <div class="card panel">
        <div class="panel-head"><span>当前步骤</span><span id="stepNo">1 / 1</span></div>
        <div class="desc" id="desc"></div>
        <div class="formula" id="formula"></div>
      </div>
      <div class="card panel" style="padding-bottom:4px">
        <div class="panel-head"><span>对应代码</span><span class="tag">Python</span></div>
        <pre><span class="ln" data-id="init">left = best = 0</span>
<span class="ln" data-id="jump">left = last[ch] + 1</span>
<span class="ln" data-id="put">last[ch] = right</span>
<span class="ln" data-id="best">best = max(best, right - left + 1)</span></pre>
      </div>
      <div class="card panel notes">
        <div class="panel-head"><span>看的时候盯住</span></div>
        <p>先把重复赶出去，再更新 best。</p>
        <p>窗口左边的旧下标不能把 left 拉回去。</p>
      </div>
    </div>
  </div>
  <div class="controls">
    <button id="prev">◀ 上一步</button>
    <button id="play" class="primary">▶ 播放</button>
    <button id="next">下一步 ▶</button>
    <button id="reset">重置</button>
    <label class="speed">速度
      <select id="speed">
        <option value="1400">0.5×</option>
        <option value="850" selected>1×</option>
        <option value="520">1.5×</option>
        <option value="320">2×</option>
      </select>
    </label>
    <div class="hint"><kbd>空格</kbd> 播放 / 暂停 · <kbd>←</kbd> <kbd>→</kbd> 单步 · <kbd>R</kbd> 重置</div>
  </div>
</div>
<script>
var STEPS = [{"s": "abcabcbb", "left": 0, "right": -1, "best": 0, "desc": "窗口还是空的。<b>left = 0</b>，<b>best = 0</b>。右指针负责把字符推进来，一旦重复就把左边界跳过上一次出现的位置。", "formula": "窗口空 · best 0", "code": ["init"]}, {"s": "abcabcbb", "left": 0, "right": 0, "best": 1, "desc": "字符 <b>'a'</b> 不在当前窗口里，直接扩进来。窗口 <b>a</b>，长度 <b>1</b>。目前最长是 <b>1</b>。", "formula": "[0..0] 长度 1 · best 1", "code": ["put", "best"]}, {"s": "abcabcbb", "left": 0, "right": 1, "best": 2, "desc": "字符 <b>'b'</b> 不在当前窗口里，直接扩进来。窗口 <b>ab</b>，长度 <b>2</b>。目前最长是 <b>2</b>。", "formula": "[0..1] 长度 2 · best 2", "code": ["put", "best"]}, {"s": "abcabcbb", "left": 0, "right": 2, "best": 3, "desc": "字符 <b>'c'</b> 不在当前窗口里，直接扩进来。窗口 <b>abc</b>，长度 <b>3</b>。目前最长是 <b>3</b>。", "formula": "[0..2] 长度 3 · best 3", "code": ["put", "best"]}, {"s": "abcabcbb", "left": 1, "right": 3, "best": 3, "desc": "字符 <b>'a'</b> 还在窗口里。左边界跳到它上次出现位置的右边，窗口变成 <b>bca</b>，长度 <b>3</b>。目前最长是 <b>3</b>。", "formula": "[1..3] 长度 3 · best 3", "code": ["jump", "best"]}, {"s": "abcabcbb", "left": 2, "right": 4, "best": 3, "desc": "字符 <b>'b'</b> 还在窗口里。左边界跳到它上次出现位置的右边，窗口变成 <b>cab</b>，长度 <b>3</b>。目前最长是 <b>3</b>。", "formula": "[2..4] 长度 3 · best 3", "code": ["jump", "best"]}, {"s": "abcabcbb", "left": 3, "right": 5, "best": 3, "desc": "字符 <b>'c'</b> 还在窗口里。左边界跳到它上次出现位置的右边，窗口变成 <b>abc</b>，长度 <b>3</b>。目前最长是 <b>3</b>。", "formula": "[3..5] 长度 3 · best 3", "code": ["jump", "best"]}, {"s": "abcabcbb", "left": 5, "right": 6, "best": 3, "desc": "字符 <b>'b'</b> 还在窗口里。左边界跳到它上次出现位置的右边，窗口变成 <b>cb</b>，长度 <b>2</b>。目前最长是 <b>3</b>。", "formula": "[5..6] 长度 2 · best 3", "code": ["jump", "best"]}, {"s": "abcabcbb", "left": 7, "right": 7, "best": 3, "desc": "字符 <b>'b'</b> 还在窗口里。左边界跳到它上次出现位置的右边，窗口变成 <b>b</b>，长度 <b>1</b>。目前最长是 <b>3</b>。", "formula": "[7..7] 长度 1 · best 3", "code": ["jump", "best"]}];

function draw(step) {
  var host = document.getElementById("board");
  host.innerHTML = "";
  for (var i = 0; i < step.s.length; i++) {
    var el = document.createElement("div");
    el.className = "cell";
    if (i === step.right) el.classList.add("i");
    else if (i >= step.left && i <= step.right) el.classList.add("win");
    else el.classList.add("dim");
    el.innerHTML = "<span class='idx'>" + i + "</span>" + step.s[i];
    host.appendChild(el);
  }
  document.getElementById("ans").textContent = "best = " + step.best + (step.right >= 0 ? " · 窗口 " + step.s.slice(step.left, step.right + 1) : "");
}


  var cur = 0, timer = null;
  var playBtn = document.getElementById("play");
  var speedSel = document.getElementById("speed");
  function highlight(ids) {
    document.querySelectorAll(".ln").forEach(function (el) {
      el.classList.toggle("hl", ids.indexOf(el.dataset.id) >= 0);
    });
  }
  function render(i) {
    cur = i;
    var step = STEPS[i];
    document.getElementById("stepNo").textContent = (i + 1) + " / " + STEPS.length;
    document.getElementById("desc").innerHTML = step.desc;
    document.getElementById("formula").innerHTML = step.formula || "";
    highlight(step.code || []);
    draw(step);
  }
  function stopTimer() {
    if (timer !== null) { clearInterval(timer); timer = null; }
    playBtn.textContent = "▶ 播放";
  }
  function play() {
    if (cur >= STEPS.length - 1) render(0);
    stopTimer();
    playBtn.textContent = "⏸ 暂停";
    timer = setInterval(function () {
      if (cur >= STEPS.length - 1) { stopTimer(); return; }
      render(cur + 1);
    }, parseInt(speedSel.value, 10));
  }
  playBtn.addEventListener("click", function () { if (timer === null) play(); else stopTimer(); });
  document.getElementById("prev").addEventListener("click", function () { stopTimer(); render(Math.max(0, cur - 1)); });
  document.getElementById("next").addEventListener("click", function () { stopTimer(); render(Math.min(STEPS.length - 1, cur + 1)); });
  document.getElementById("reset").addEventListener("click", function () { stopTimer(); render(0); });
  speedSel.addEventListener("change", function () { if (timer !== null) play(); });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); if (timer === null) play(); else stopTimer(); }
    else if (e.code === "ArrowRight") { e.preventDefault(); stopTimer(); render(Math.min(STEPS.length - 1, cur + 1)); }
    else if (e.code === "ArrowLeft") { e.preventDefault(); stopTimer(); render(Math.max(0, cur - 1)); }
    else if (e.code === "KeyR") { e.preventDefault(); stopTimer(); render(0); }
  });
  render(0);

</script>
</body>
</html>
