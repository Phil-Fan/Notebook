<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;650&family=JetBrains+Mono:wght@400;600&display=swap" />
<title>旋转图像 · 转置再翻转</title>
<style>
  :root{
    color-scheme:dark;
    --background:oklch(0.2046 0 0);
    --foreground:oklch(0.9219 0 0);
    --card:oklch(0.2686 0 0);
    --muted:oklch(0.2393 0 0);
    --muted-foreground:oklch(0.7155 0 0);
    --primary:oklch(0.6231 0.1880 259.8145);
    --primary-foreground:oklch(1.0000 0 0);
    --secondary:oklch(0.2686 0 0);
    --accent:oklch(0.3791 0.1378 265.5222);
    --accent-foreground:oklch(0.8823 0.0571 254.1284);
    --destructive:oklch(0.6368 0.2078 25.3313);
    --border:oklch(0.3715 0 0);
    --chart-1:oklch(0.7137 0.1434 254.6240);
    --chart-2:oklch(0.6231 0.1880 259.8145);
    --chart-3:oklch(0.5461 0.2152 262.8809);
    --chart-4:oklch(0.4882 0.2172 264.3763);
    --chart-5:oklch(0.4244 0.1809 265.6377);
    --radius:0.375rem;
    --font-sans:Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root{
    --panel:oklch(0.2046 0.0000 0.0000 / 0.720); --line:oklch(0.7155 0.0000 0.0000 / 0.200); --text:oklch(0.9219 0.0000 0.0000); --dim:oklch(0.7155 0.0000 0.0000);
    --amber:oklch(0.6231 0.1880 259.8145); --green:oklch(0.7137 0.1434 254.6240); --blue:oklch(0.7137 0.1434 254.6240); --purple:oklch(0.4882 0.2172 264.3763); --pink:oklch(0.6368 0.2078 25.3313); --teal:oklch(0.7137 0.1434 254.6240);
    --mono:var(--font-mono);
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;padding:24px;color:var(--text);
    font-family:var(--font-sans);
    background:var(--background);
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto}
  header{margin-bottom:14px}
  h1{margin:0 0 6px;font-size:21px;font-weight:650}
  header p{margin:0;color:var(--dim);font-size:13px;line-height:1.62;max-width:1010px}
  header p+p{margin-top:4px}
  header p b{color:oklch(0.7137 0.1434 254.6240);font-weight:600}
  header code{font-family:var(--mono);font-size:12px;color:oklch(0.7137 0.1434 254.6240);background:oklch(0.6231 0.1880 259.8145 / 0.100);padding:1px 6px;border-radius:6px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:18px;align-items:start}
  @media (max-width:920px){.layout{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px);box-shadow:0 14px 40px rgba(0,0,0,.35)}
  .stage{background:linear-gradient(180deg,oklch(0.2393 0.0000 0.0000 / 0.850),oklch(0.2046 0.0000 0.0000 / 0.850));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.38)}
  .sec-label{text-align:center;font-size:10.5px;letter-spacing:.5px;color:oklch(0.3715 0.0000 0.0000);font-family:var(--mono);margin:0 0 8px}
  .row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 12px;padding-top:16px}
  .cell{position:relative;min-width:42px;height:48px;padding:0 6px;border-radius:10px;border:1px solid oklch(0.7155 0.0000 0.0000 / 0.220);
    background:oklch(0.2393 0.0000 0.0000 / 0.550);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:16px;color:oklch(0.7137 0.1434 254.6240)}
  .cell .idx{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:9.5px;color:oklch(0.3715 0.0000 0.0000);font-family:var(--mono)}
  .cell.i{border-color:var(--amber);box-shadow:0 0 0 2px oklch(0.6231 0.1880 259.8145 / 0.280);color:oklch(0.9219 0.0000 0.0000)}
  .cell.l{background:oklch(0.7137 0.1434 254.6240 / 0.160);border-color:oklch(0.7137 0.1434 254.6240 / 0.700);color:oklch(0.9219 0.0000 0.0000)}
  .cell.r{background:oklch(0.4882 0.2172 264.3763 / 0.160);border-color:oklch(0.4882 0.2172 264.3763 / 0.700);color:oklch(0.9219 0.0000 0.0000)}
  .cell.win{background:oklch(0.7137 0.1434 254.6240 / 0.160);border-color:oklch(0.7137 0.1434 254.6240 / 0.550)}
  .cell.best{background:oklch(0.7137 0.1434 254.6240 / 0.160);border-color:oklch(0.7137 0.1434 254.6240 / 0.620);color:oklch(0.9219 0.0000 0.0000)}
  .cell.bad{background:oklch(0.6368 0.2078 25.3313 / 0.120);border-color:oklch(0.6368 0.2078 25.3313 / 0.600);color:oklch(0.9219 0.0000 0.0000)}
  .cell.dim{opacity:.35}
  .grid{display:grid;gap:6px;justify-content:center;margin:10px 0}
  .g{width:52px;height:52px;border-radius:10px;border:1px solid oklch(0.7155 0.0000 0.0000 / 0.250);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:16px;background:oklch(0.2393 0.0000 0.0000 / 0.550);color:oklch(0.9219 0.0000 0.0000)}
  .g.on{border-color:var(--amber);box-shadow:0 0 0 2px oklch(0.6231 0.1880 259.8145 / 0.280);color:oklch(0.9219 0.0000 0.0000)}
  .g.pair{border-color:var(--purple);background:oklch(0.4882 0.2172 264.3763 / 0.160)}
  .g.land{background:oklch(0.7137 0.1434 254.6240 / 0.160);border-color:oklch(0.7137 0.1434 254.6240 / 0.550);color:oklch(0.9219 0.0000 0.0000)}
  .g.sea{opacity:.45}
  .g.hot{border-color:var(--amber);box-shadow:0 0 0 2px oklch(0.6231 0.1880 259.8145 / 0.300)}
  .g.ans{background:oklch(0.7137 0.1434 254.6240 / 0.200);border-color:oklch(0.7137 0.1434 254.6240 / 0.700)}
  table.dp{border-collapse:separate;border-spacing:4px;margin:8px auto}
  table.dp td,table.dp th{width:42px;height:36px;text-align:center;font-family:var(--mono);font-size:13px;border-radius:8px}
  table.dp th{color:oklch(0.7155 0.0000 0.0000);font-weight:500}
  table.dp td{background:oklch(0.2393 0.0000 0.0000 / 0.550);border:1px solid oklch(0.7155 0.0000 0.0000 / 0.220);color:oklch(0.9219 0.0000 0.0000)}
  table.dp td.cur{border-color:var(--amber);box-shadow:0 0 0 2px oklch(0.6231 0.1880 259.8145 / 0.250);color:oklch(0.9219 0.0000 0.0000)}
  table.dp td.src{border-color:oklch(0.7137 0.1434 254.6240 / 0.700);background:oklch(0.7137 0.1434 254.6240 / 0.140)}
  .tree{display:flex;flex-direction:column;align-items:center;gap:16px;margin:12px 0}
  .trow{display:flex;gap:28px}
  .node{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    border:1px solid oklch(0.7155 0.0000 0.0000 / 0.350);background:oklch(0.2393 0.0000 0.0000 / 0.700)}
  .node.lvl{border-color:oklch(0.7137 0.1434 254.6240 / 0.700);background:oklch(0.7137 0.1434 254.6240 / 0.160)}
  .node.view{border-color:var(--green);background:oklch(0.7137 0.1434 254.6240 / 0.180);color:oklch(0.9219 0.0000 0.0000)}
  .legend{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;font-size:11px;color:oklch(0.7155 0.0000 0.0000);margin:4px 0 8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid transparent}
  .side{display:flex;flex-direction:column;gap:12px}
  .panel{padding:12px 14px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.4px;color:oklch(0.7155 0.0000 0.0000);text-transform:uppercase;margin-bottom:8px}
  .panel-head .tag{font-family:var(--mono);font-size:10px;color:oklch(0.7137 0.1434 254.6240);text-transform:none;background:oklch(0.6231 0.1880 259.8145 / 0.100);border:1px solid oklch(0.6231 0.1880 259.8145 / 0.250);padding:1px 7px;border-radius:6px}
  .desc{font-size:13px;line-height:1.72;color:oklch(0.9219 0.0000 0.0000);min-height:88px}
  .desc b{color:oklch(0.9219 0.0000 0.0000)}
  .formula{margin-top:10px;padding-top:9px;border-top:1px dashed oklch(0.7155 0.0000 0.0000 / 0.220);font-family:var(--mono);font-size:11.5px;line-height:1.7;color:oklch(0.7155 0.0000 0.0000)}
  .formula b{color:oklch(0.9219 0.0000 0.0000)}
  pre{margin:0;padding:8px 0 10px;font-family:var(--mono);font-size:11.5px;line-height:1.62;color:oklch(0.7155 0.0000 0.0000);overflow:auto;max-height:360px}
  .ln{display:block;padding:0 14px;white-space:pre;border-left:2px solid transparent}
  .ln.hl{background:oklch(0.6231 0.1880 259.8145 / 0.100);border-left-color:var(--amber);color:oklch(0.6231 0.1880 259.8145)}
  .notes p{margin:0 0 8px;font-size:11.5px;line-height:1.7;color:oklch(0.7155 0.0000 0.0000)}
  .notes p:last-child{margin:0}
  .notes code{font-family:var(--mono);font-size:11px;color:oklch(0.7137 0.1434 254.6240);background:oklch(0.6231 0.1880 259.8145 / 0.100);padding:1px 5px;border-radius:5px}
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}
  button{font-family:inherit;font-size:12.5px;color:oklch(0.9219 0.0000 0.0000);background:oklch(0.2393 0.0000 0.0000 / 0.850);border:1px solid oklch(0.7155 0.0000 0.0000 / 0.300);border-radius:9px;padding:8px 13px;cursor:pointer}
  button.primary{background:oklch(0.6231 0.1880 259.8145 / 0.180);border-color:oklch(0.6231 0.1880 259.8145 / 0.450)}
  .speed{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:oklch(0.7155 0.0000 0.0000)}
  select{font-family:inherit;font-size:11.5px;color:oklch(0.9219 0.0000 0.0000);background:oklch(0.2393 0.0000 0.0000 / 0.850);border:1px solid oklch(0.7155 0.0000 0.0000 / 0.300);border-radius:8px;padding:5px 7px}
  .hint{width:100%;font-size:11px;color:oklch(0.3715 0.0000 0.0000)}
  kbd{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:5px;border:1px solid oklch(0.7155 0.0000 0.0000 / 0.350);background:oklch(0.2393 0.0000 0.0000 / 0.800);color:oklch(0.7137 0.1434 254.6240)}
  .ans{text-align:center;font-family:var(--mono);font-size:13px;color:oklch(0.7137 0.1434 254.6240);min-height:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>旋转图像 · 转置再翻转</h1>
    <p>3×3 先交换上三角的三对，再把每一行左右翻转。</p>
    <p>主色和深蓝是正在交换的两个格子。先翻转再转置会得到逆时针。</p>
  </header>
  <div class="layout">
    <div class="stage">
      <div class="sec-label">matrix</div>
      <div class="grid" id="board"></div>
    </div>
    <div class="side">
      <div class="card panel">
        <div class="panel-head"><span>当前步骤</span><span id="stepNo">1 / 1</span></div>
        <div class="desc" id="desc"></div>
        <div class="formula" id="formula"></div>
      </div>
      <div class="card panel" style="padding-bottom:4px">
        <div class="panel-head"><span>对应代码</span><span class="tag">Python</span></div>
        <pre><span class="ln" data-id="init">n = len(matrix)</span>
<span class="ln" data-id="swap">matrix[i][j], matrix[j][i] = ...</span>
<span class="ln" data-id="flip">row.reverse()</span>
<span class="ln" data-id="ret"># [[7,4,1],[8,5,2],[9,6,3]]</span></pre>
      </div>
      <div class="card panel notes">
        <div class="panel-head"><span>看的时候盯住</span></div>
        <p>转置只走 j &gt; i。</p>
        <p>中心格不参与交换。</p>
      </div>
    </div>
  </div>
  <div class="controls">
    <button id="prev">◀ 上一步</button>
    <button id="play" class="primary">▶ 播放</button>
    <button id="next">下一步 ▶</button>
    <button id="reset">重置</button>
    <label class="speed">速度
      <select id="speed">
        <option value="1400">0.5×</option>
        <option value="850" selected>1×</option>
        <option value="520">1.5×</option>
        <option value="320">2×</option>
      </select>
    </label>
    <div class="hint"><kbd>空格</kbd> 播放 / 暂停 · <kbd>←</kbd> <kbd>→</kbd> 单步 · <kbd>R</kbd> 重置</div>
  </div>
</div>
<script>
var STEPS = [{"grid": [[1, 2, 3], [4, 5, 6], [7, 8, 9]], "phase": "init", "a": null, "b": null, "desc": "原矩阵。顺时针 90° 拆成两步：先只交换上三角（转置），再把每一行左右翻转。", "formula": "[[1,2,3],[4,5,6],[7,8,9]]", "code": ["init"]}, {"grid": [[1, 4, 3], [2, 5, 6], [7, 8, 9]], "phase": "swap", "a": [0, 1], "b": [1, 0], "desc": "转置：交换 <b>(0,1)</b> 和 <b>(1,0)</b>。下三角不回头再换，否则会换回去。", "formula": "a[0][1] ↔ a[1][0]", "code": ["swap"]}, {"grid": [[1, 4, 7], [2, 5, 6], [3, 8, 9]], "phase": "swap", "a": [0, 2], "b": [2, 0], "desc": "转置：交换 <b>(0,2)</b> 和 <b>(2,0)</b>。下三角不回头再换，否则会换回去。", "formula": "a[0][2] ↔ a[2][0]", "code": ["swap"]}, {"grid": [[1, 4, 7], [2, 5, 8], [3, 6, 9]], "phase": "swap", "a": [1, 2], "b": [2, 1], "desc": "转置：交换 <b>(1,2)</b> 和 <b>(2,1)</b>。下三角不回头再换，否则会换回去。", "formula": "a[1][2] ↔ a[2][1]", "code": ["swap"]}, {"grid": [[7, 4, 1], [2, 5, 8], [3, 6, 9]], "phase": "flip", "a": [0, 0], "b": [0, 2], "desc": "第 <b>0</b> 行左右翻转。转置后再做这一步，才是顺时针而不是逆时针。", "formula": "row 0 reverse", "code": ["flip"]}, {"grid": [[7, 4, 1], [8, 5, 2], [3, 6, 9]], "phase": "flip", "a": [1, 0], "b": [1, 2], "desc": "第 <b>1</b> 行左右翻转。转置后再做这一步，才是顺时针而不是逆时针。", "formula": "row 1 reverse", "code": ["flip"]}, {"grid": [[7, 4, 1], [8, 5, 2], [9, 6, 3]], "phase": "flip", "a": [2, 0], "b": [2, 2], "desc": "第 <b>2</b> 行左右翻转。转置后再做这一步，才是顺时针而不是逆时针。", "formula": "row 2 reverse", "code": ["flip"]}, {"grid": [[7, 4, 1], [8, 5, 2], [9, 6, 3]], "phase": "done", "a": null, "b": null, "desc": "得到 <b>[[7,4,1],[8,5,2],[9,6,3]]</b>。中心的 5 两次都没动。", "formula": "done", "code": ["ret"]}];

function draw(step) {
  var host = document.getElementById("board");
  host.innerHTML = "";
  host.style.gridTemplateColumns = "repeat(" + step.grid[0].length + ", 52px)";
  step.grid.forEach(function (row, i) {
    row.forEach(function (v, j) {
      var el = document.createElement("div");
      el.className = "g";
      var mark = function (p, cls) {
        if (p && p[0] === i && p[1] === j) el.classList.add(cls);
      };
      mark(step.a, "on");
      mark(step.b, "pair");
      el.textContent = v;
      host.appendChild(el);
    });
  });
}


  var cur = 0, timer = null;
  var playBtn = document.getElementById("play");
  var speedSel = document.getElementById("speed");
  function highlight(ids) {
    document.querySelectorAll(".ln").forEach(function (el) {
      el.classList.toggle("hl", ids.indexOf(el.dataset.id) >= 0);
    });
  }
  function render(i) {
    cur = i;
    var step = STEPS[i];
    document.getElementById("stepNo").textContent = (i + 1) + " / " + STEPS.length;
    document.getElementById("desc").innerHTML = step.desc;
    document.getElementById("formula").innerHTML = step.formula || "";
    highlight(step.code || []);
    draw(step);
  }
  function stopTimer() {
    if (timer !== null) { clearInterval(timer); timer = null; }
    playBtn.textContent = "▶ 播放";
  }
  function play() {
    if (cur >= STEPS.length - 1) render(0);
    stopTimer();
    playBtn.textContent = "⏸ 暂停";
    timer = setInterval(function () {
      if (cur >= STEPS.length - 1) { stopTimer(); return; }
      render(cur + 1);
    }, parseInt(speedSel.value, 10));
  }
  playBtn.addEventListener("click", function () { if (timer === null) play(); else stopTimer(); });
  document.getElementById("prev").addEventListener("click", function () { stopTimer(); render(Math.max(0, cur - 1)); });
  document.getElementById("next").addEventListener("click", function () { stopTimer(); render(Math.min(STEPS.length - 1, cur + 1)); });
  document.getElementById("reset").addEventListener("click", function () { stopTimer(); render(0); });
  speedSel.addEventListener("change", function () { if (timer !== null) play(); });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); if (timer === null) play(); else stopTimer(); }
    else if (e.code === "ArrowRight") { e.preventDefault(); stopTimer(); render(Math.min(STEPS.length - 1, cur + 1)); }
    else if (e.code === "ArrowLeft") { e.preventDefault(); stopTimer(); render(Math.max(0, cur - 1)); }
    else if (e.code === "KeyR") { e.preventDefault(); stopTimer(); render(0); }
  });
  render(0);

</script>
</body>
</html>
